<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Kitchen — 菜谱列表新版预览</title>
<style>
  :root {
    --bg: #FAF8F5;
    --bg-alt: #F5F1EB;
    --surface: #FFFFFF;
    --surface-hover: #FBF9F6;
    --primary: #6B5846;
    --primary-light: #8B7355;
    --primary-dark: #4A3D30;
    --primary-bg: #F0EBE3;
    --accent: #C8855A;
    --accent-light: #D9A57A;
    --accent-bg: #FAF0E8;
    --text: #3D352E;
    --text-secondary: #8B7E70;
    --text-tertiary: #B5A99B;
    --text-inverse: #FAF8F5;
    --border: #E8E2D9;
    --border-light: #F0EBE3;
    --border-strong: #D4CABE;
    --tag-cuisine-bg: #EEF2F8; --tag-cuisine-text: #5B6B8A;
    --tag-ingredient-bg: #EDF3EC; --tag-ingredient-text: #5A7A4E;
    --tag-flavor-bg: #FBF0EB; --tag-flavor-text: #A66B4A;
    --tag-method-bg: #F3EEF6; --tag-method-text: #7A5E8A;
    --shadow-sm: 0 1px 2px rgba(61,53,46,0.04);
    --shadow-md: 0 2px 8px rgba(61,53,46,0.06);
    --shadow-lg: 0 4px 16px rgba(61,53,46,0.08);
    --shadow-xl: 0 8px 32px rgba(61,53,46,0.12);
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-xl: 24px; --radius-full: 9999px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 15px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ul { list-style: none; }

  /* ===== Navbar (借鉴截图: 顶部水平导航 + 胶囊高亮) ===== */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250, 248, 245, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
  }

  .navbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .navbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .navbar-logo svg { flex-shrink: 0; }

  .navbar-links {
    display: flex;
    gap: 4px;
    background: var(--bg-alt);
    border-radius: var(--radius-full);
    padding: 4px;
  }

  .navbar-link {
    padding: 7px 18px;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all var(--transition);
  }

  .navbar-link:hover {
    color: var(--text);
  }

  .navbar-link.active {
    color: var(--text-inverse);
    background-color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  /* ===== Main Content ===== */
  .main-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ===== Page Header (借鉴截图: 大标题 + 副标题) ===== */
  .page-header {
    margin-bottom: 28px;
  }

  .page-title {
    font-size: 32px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .page-subtitle {
    font-size: 15px;
    color: var(--text-secondary);
  }

  /* ===== Search Bar (借鉴截图: 紧贴标题下方) ===== */
  .search-bar {
    position: relative;
    margin-bottom: 20px;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 13px 44px 13px 44px;
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    background-color: var(--surface);
    outline: none;
    font-size: 15px;
    transition: border-color var(--transition), box-shadow var(--transition);
    box-shadow: var(--shadow-sm);
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  /* ===== Filter Bar (借鉴截图: 分类胶囊横排) ===== */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }

  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-chip {
    padding: 7px 16px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 500;
    background-color: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    transition: all var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .filter-chip:hover {
    border-color: var(--border-strong);
    color: var(--text);
  }

  .filter-chip.active {
    background-color: var(--primary);
    color: var(--text-inverse);
    border-color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  /* ===== Tag Filter (可折叠区域) ===== */
  .tag-filter-section {
    margin-bottom: 28px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    overflow: hidden;
  }

  .tag-filter-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    width: 100%;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    transition: background var(--transition);
  }

  .tag-filter-toggle:hover {
    background: var(--surface-hover);
  }

  .tag-filter-toggle .chevron {
    transition: transform var(--transition);
    color: var(--text-tertiary);
  }

  .tag-filter-toggle.expanded .chevron {
    transform: rotate(180deg);
  }

  .tag-filter-body {
    display: none;
    padding: 0 20px 16px;
  }

  .tag-filter-body.show {
    display: block;
  }

  .tag-filter-group {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border-light);
  }

  .tag-filter-group:first-child {
    border-top: none;
  }

  .tag-filter-group-label {
    font-size: 12px;
    color: var(--text-tertiary);
    min-width: 56px;
    flex-shrink: 0;
    padding-top: 5px;
    font-weight: 600;
  }

  .tag-filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag-filter-chip {
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    background-color: var(--bg-alt);
    color: var(--text-secondary);
    border: 1px solid transparent;
    transition: all var(--transition);
  }

  .tag-filter-chip:hover {
    color: var(--text);
  }

  .tag-filter-chip.active {
    background-color: var(--primary);
    color: var(--text-inverse);
  }

  /* ===== Add Button (借鉴截图: 浮动 FAB 或右上角) ===== */
  .add-recipe-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--text-inverse);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-xl);
    z-index: 50;
    transition: all var(--transition);
    font-size: 28px;
  }

  .add-recipe-btn:hover {
    background: var(--primary-dark);
    transform: scale(1.05);
  }

  /* ===== Recipe Grid (借鉴截图: 大卡片, 封面主导) ===== */
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  .recipe-card {
    display: block;
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border-light);
    transition: all var(--transition);
    cursor: pointer;
  }

  .recipe-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-lg);
    transform: translateY(-3px);
  }

  /* Cover: 1:1, 视觉主导 */
  .recipe-card-cover {
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
  }

  .recipe-cover-gradient {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }

  /* 分类浮签 (借鉴截图: 左上角浮在封面上) */
  .recipe-card-category-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  .recipe-card-body {
    padding: 16px 18px 18px;
  }

  .recipe-card-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .recipe-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag-chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }

  .tag-cuisine { background: var(--tag-cuisine-bg); color: var(--tag-cuisine-text); }
  .tag-ingredient { background: var(--tag-ingredient-bg); color: var(--tag-ingredient-text); }
  .tag-flavor { background: var(--tag-flavor-bg); color: var(--tag-flavor-text); }
  .tag-method { background: var(--tag-method-bg); color: var(--tag-method-text); }

  /* ===== Result count bar ===== */
  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .result-count {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .clear-btn {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    transition: background var(--transition);
  }

  .clear-btn:hover {
    background: var(--accent-bg);
  }

  /* ===== Mobile ===== */
  @media (max-width: 768px) {
    .navbar-links {
      gap: 2px;
      padding: 3px;
    }
    .navbar-link {
      padding: 6px 14px;
      font-size: 13px;
    }
    .main-content {
      padding: 24px 16px 100px;
    }
    .page-title {
      font-size: 26px;
    }
    .recipe-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .recipe-card-body {
      padding: 12px 14px 14px;
    }
    .recipe-card-name {
      font-size: 14px;
      margin-bottom: 6px;
    }
    .tag-chip {
      font-size: 10px;
      padding: 2px 7px;
    }
    .recipe-card-category-badge {
      font-size: 10px;
      padding: 3px 9px;
      top: 8px;
      left: 8px;
    }
    .recipe-cover-gradient {
      font-size: 40px;
    }
    .add-recipe-btn {
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      font-size: 24px;
    }
    .tag-filter-group {
      flex-direction: column;
      gap: 6px;
    }
    .tag-filter-group-label {
      padding-top: 0;
    }
  }

  @media (max-width: 380px) {
    .recipe-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<!-- ===== Navbar ===== -->
<nav class="navbar">
  <div class="navbar-inner">

      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">

</nav>

<!-- ===== Main Content ===== -->
<div class="main-content">

  <div class="search-bar">

          <button class="tag-filter-chip">蔬菜</button>

        <div class="tag-filter-chips">

<script>
  function toggleTagFilter(btn) {
    const body = document.getElementById('tagFilterBody');
    btn.classList.toggle('expanded');
    body.classList.toggle('show');
  }

  // 分类筛选交互
  document.querySelectorAll('.filter-bar .filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-bar .filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  // 标签筛选交互
  document.querySelectorAll('.tag-filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
    });
  });
</script>
